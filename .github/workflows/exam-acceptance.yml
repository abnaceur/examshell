name: Exam Phase Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create read token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.EXAM_DELIVERY_APP_ID }}
          private-key: ${{ secrets.EXAM_DELIVERY_APP_PRIVATE_KEY }}
          owner: abnaceur
          repositories: 1122-exam-delivery
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          path: work
      - uses: actions/checkout@v4
        with:
          repository: abnaceur/1122-exam-delivery
          token: ${{ steps.app-token.outputs.token }}
          path: delivery
      - name: Validate phase evidence when this is a phase PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          phase=$(printf '%s\n%s\n' "$TITLE" "$BRANCH" | grep -Eio 'EXAM-PHASE-(0[0-9]|1[0-9]|2[0-7])' | head -1 | tr '[:lower:]' '[:upper:]' || true)
          if [ -z "$phase" ]; then
            echo "Not an exam phase PR"
            exit 0
          fi
          validator=delivery/bin/validate-phase-output.mjs
          if [ -f "work/bin/validate-phase-output.mjs" ]; then validator=work/bin/validate-phase-output.mjs; fi
          node "$validator" --phase "delivery/features/exam-platform/phases/$phase.json" --evidence "work/.exam-delivery/$phase-acceptance.json" --repository "$GITHUB_REPOSITORY"
